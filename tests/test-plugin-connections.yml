name: Test Steampipe setup with plugin connections
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          steampipe-version: latest
          plugin-connections: |
            connection "chaos" {
              plugin = "chaos"
            }
        continue-on-error: true
      - name: Assert steampipe-version output is set (if action succeeded)
        env:
          VERSION: ${{ steps.action.outputs.steampipe-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "steampipe-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but steampipe-version output is empty"
              exit 1
            fi
            echo "PASS: steampipe-version is '$VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert steampipe binary is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v steampipe >/dev/null 2>&1; then
              echo "FAIL: steampipe not found on PATH after successful install"
              exit 1
            fi
            echo "PASS: steampipe found at $(command -v steampipe)"
          else
            echo "SKIP: action did not succeed, skipping binary check"
          fi
      - name: Assert chaos plugin connection config was created (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            CONFIG_DIR="$HOME/.steampipe/config"
            echo "Listing config dir: $CONFIG_DIR"
            ls -la "$CONFIG_DIR" 2>/dev/null || true
            # The action writes HCL connections to ~/.steampipe/config/connections.spc
            if grep -rl 'chaos' "$CONFIG_DIR" 2>/dev/null | grep -q .; then
              echo "PASS: chaos connection config found"
            else
              echo "FAIL: chaos connection config not found in $CONFIG_DIR"
              exit 1
            fi
          else
            echo "SKIP: action did not succeed, skipping config check"
          fi
