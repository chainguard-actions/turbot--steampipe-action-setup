name: Test plugin connections configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          plugin-connections: |
            connection "chaos" {
              plugin = "chaos"
            }
      - name: Assert steampipe-version output or graceful failure
        env:
          VERSION: ${{ steps.setup.outputs.steampipe-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "steampipe-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but steampipe-version output is empty"
              exit 1
            fi
            echo "PASS: steampipe-version is '$VERSION'"
            # Check that connection config file was created
            CONFIG_DIR="$HOME/.steampipe/config"
            echo "Looking for connection config in: $CONFIG_DIR"
            ls -la "$CONFIG_DIR" 2>/dev/null || true
            if ls "$CONFIG_DIR"/*.spc 2>/dev/null | grep -q .; then
              echo "PASS: connection config file(s) found"
              cat "$CONFIG_DIR"/*.spc
            else
              echo "FAIL: no .spc connection config files found in $CONFIG_DIR"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in act environment - plugin install may require network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
