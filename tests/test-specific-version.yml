name: Test Steampipe setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          steampipe-version: "0.20.8"
        continue-on-error: true
      - name: Assert steampipe-version output equals requested version
        env:
          VERSION: ${{ steps.action.outputs.steampipe-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "steampipe-version output: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but steampipe-version output is empty"
              exit 1
            fi
            # The version output may include the 'v' prefix (e.g., v0.20.8) since
            # it comes from GitHub release tag names
            STRIPPED="${VERSION#v}"
            if [ "$STRIPPED" != "0.20.8" ]; then
              echo "FAIL: expected '0.20.8' (with or without v prefix), got '$VERSION'"
              exit 1
            fi
            echo "PASS: steampipe-version is '$VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert steampipe binary is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v steampipe >/dev/null 2>&1; then
              echo "FAIL: steampipe not found on PATH after successful install"
              exit 1
            fi
            echo "PASS: steampipe found at $(command -v steampipe)"
          else
            echo "SKIP: action did not succeed, skipping binary check"
          fi
      - name: Assert steampipe reports correct version (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            ACTUAL="$(steampipe --version 2>&1 | head -1)"
            echo "steampipe --version: $ACTUAL"
            if echo "$ACTUAL" | grep -qF "0.20.8"; then
              echo "PASS: version 0.20.8 confirmed"
            else
              echo "FAIL: expected '0.20.8' in version output, got: $ACTUAL"
              exit 1
            fi
          else
            echo "SKIP: action did not succeed, skipping version binary check"
          fi
