name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          steampipe-version: "0.20.8"
      - name: Assert steampipe-version output matches requested version or graceful failure
        env:
          VERSION: ${{ steps.setup.outputs.steampipe-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "steampipe-version output: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but steampipe-version output is empty"
              exit 1
            fi
            if echo "$VERSION" | grep -qF "0.20.8"; then
              echo "PASS: version output contains '0.20.8'"
            else
              echo "FAIL: expected version to contain '0.20.8', got '$VERSION'"
              exit 1
            fi
            # Also verify steampipe is on PATH
            if ! command -v steampipe >/dev/null 2>&1; then
              echo "FAIL: steampipe not found on PATH after successful setup"
              exit 1
            fi
            echo "PASS: steampipe found at $(command -v steampipe)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
