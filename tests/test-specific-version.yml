name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          steampipe-version: "0.20.8"
        continue-on-error: true
      - name: Assert steampipe-version output matches requested version
        env:
          VERSION: ${{ steps.action.outputs.steampipe-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "steampipe-version output: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: steampipe-version output is empty on success"
              exit 1
            fi
            # The version output may include a 'v' prefix (e.g. v0.20.8)
            VERSION_STRIPPED="${VERSION#v}"
            if [ "$VERSION_STRIPPED" != "0.20.8" ]; then
              echo "FAIL: expected version '0.20.8' but got '$VERSION' (stripped: '$VERSION_STRIPPED')"
              exit 1
            fi
            echo "PASS: version is '$VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (steampipe initialization may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert steampipe is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v steampipe >/dev/null 2>&1; then
              echo "FAIL: steampipe not found on PATH"
              exit 1
            fi
            echo "PASS: steampipe found at $(command -v steampipe)"
          else
            echo "SKIP: action did not succeed, skipping PATH check"
          fi
      - name: Assert installed version matches requested (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            INSTALLED="$(steampipe --version 2>&1 | head -1)"
            echo "steampipe --version: $INSTALLED"
            if ! echo "$INSTALLED" | grep -qF "0.20.8"; then
              echo "FAIL: installed version '$INSTALLED' does not contain '0.20.8'"
              exit 1
            fi
            echo "PASS: correct version installed"
          else
            echo "SKIP: action did not succeed, skipping version check"
          fi
